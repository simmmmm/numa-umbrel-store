services:
  app_proxy:
    environment:
      APP_HOST: numa-home_server_1
      APP_PORT: 8283
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/simmmmm/numa-home:0.51.0@sha256:9fadf6f35807c2955ac9f0d3991cf5e6499aa1309dd226cf9dc4620fc26cd23e
    user: "1000:1000"
    restart: on-failure
    environment:
      TZ: Etc/UTC
      NUMA_HOME_PROXY: ${NETWORK_IP}/16
    volumes:
      - ${APP_DATA_DIR}/data/photos:/photos
      - ${APP_DATA_DIR}/data/sent:/sent
      - ${APP_DATA_DIR}/data/server:/data
