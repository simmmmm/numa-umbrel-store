services:
  app_proxy:
    environment:
      APP_HOST: numa-home_server_1
      APP_PORT: 8283
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/simmmmm/numa-home:0.52.0-home.4@sha256:f3b3fc5cb3bfcc631d6d87e125af3a5b972f57c689528e8487a5b9bef0d85805
    user: "1000:1000"
    restart: on-failure
    environment:
      TZ: Etc/UTC
      NUMA_HOME_PROXY: ${NETWORK_IP}/16
    volumes:
      - ${APP_DATA_DIR}/data/photos:/photos
      - ${APP_DATA_DIR}/data/sent:/sent
      - ${APP_DATA_DIR}/data/server:/data
