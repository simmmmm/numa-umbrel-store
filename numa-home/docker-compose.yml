services:
  app_proxy:
    environment:
      APP_HOST: numa-home_server_1
      APP_PORT: 8283
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/simmmmm/numa-home:0.48.1-home.2@sha256:fc220a3d9b123f0737481c86abf16d73d73bec660a99aba4ef42ad38433523ba
    user: "1000:1000"
    restart: on-failure
    environment:
      TZ: Etc/UTC
      NUMA_HOME_PROXY: ${NETWORK_IP}/16
    volumes:
      - ${APP_DATA_DIR}/data/photos:/photos
      - ${APP_DATA_DIR}/data/sent:/sent
      - ${APP_DATA_DIR}/data/server:/data
