services:
  app_proxy:
    environment:
      APP_HOST: numa-home_server_1
      APP_PORT: 8283
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/simmmmm/numa-home:0.53.0@sha256:dfc683c8177bb744ba83ba7e937aceb5f6c85854282eaddb97d0c5bed343ef1e
    user: "1000:1000"
    restart: on-failure
    environment:
      TZ: Etc/UTC
      NUMA_HOME_PROXY: ${NETWORK_IP}/16
    volumes:
      - ${APP_DATA_DIR}/data/photos:/photos
      - ${APP_DATA_DIR}/data/sent:/sent
      - ${APP_DATA_DIR}/data/server:/data
