services:
  app_proxy:
    environment:
      APP_HOST: numa-home_server_1
      APP_PORT: 8283
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/simmmmm/numa-home:0.52.0-home.5@sha256:02d11170af678a1950bfbe8eb8997c34ddf5c074c4a980dcccef5eb89ac8adf4
    user: "1000:1000"
    restart: on-failure
    environment:
      TZ: Etc/UTC
      NUMA_HOME_PROXY: ${NETWORK_IP}/16
    volumes:
      - ${APP_DATA_DIR}/data/photos:/photos
      - ${APP_DATA_DIR}/data/sent:/sent
      - ${APP_DATA_DIR}/data/server:/data
